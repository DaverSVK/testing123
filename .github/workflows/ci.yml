  gpio-led-frequency-test:
    name: "GPIO LED Frequency Test"
    runs-on: [self-hosted, Linux, ARM64]
    needs: flash-stm32
    if: github.event_name == 'push'

    env:
      STM32_TARGET_CFG: target/stm32f3x.cfg
      BUTTON_GPIO: "17"
      LED_GPIO: "27"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Install GPIO tools
      #   run: |
      #     sudo apt-get update -qq
      #     sudo apt-get install -y python3-gpiozero python3-lgpio
      - name: Debug runner GPIO access
        run: |
          whoami
          id
          groups
          ls -l /dev/gpiochip*
          ls -l /dev/gpiomem*
          python3 - <<'PYEOF'
          import os
          print("UID:", os.getuid())
          print("GID:", os.getgid())
          print("Groups:", os.getgroups())

          import lgpio
          chip = lgpio.gpiochip_open(0)
          print("Opened gpiochip0 OK")
          lgpio.gpiochip_close(chip)
          PYEOF
      - name: Reset STM32
        run: |
          openocd -f interface/stlink.cfg -f "$STM32_TARGET_CFG" \
            -c "init" \
            -c "reset run" \
            -c "shutdown"

      - name: Test LED frequency using Raspberry Pi GPIO
        run: |
          python3 - <<'PYEOF'
          import os
          import time
          import sys
          from gpiozero import LED, DigitalInputDevice

          button_gpio = int(os.environ.get("BUTTON_GPIO", "17"))
          led_gpio = int(os.environ.get("LED_GPIO", "27"))

          # RPi GPIO17 acts like the button signal into STM PA3
          stm_button = LED(button_gpio)

          # RPi GPIO27 reads STM PA4 LED output
          stm_led = DigitalInputDevice(led_gpio, pull_up=False)

          def measure_frequency(duration_s=5.0):
              """
              Measures rising edges on STM LED output.
              Frequency = rising_edges / measured_time.
              """
              start = time.monotonic()
              end = start + duration_s

              last_state = stm_led.value
              rising_edges = 0
              edge_times = []

              while time.monotonic() < end:
                  state = stm_led.value

                  if state == 1 and last_state == 0:
                      rising_edges += 1
                      edge_times.append(time.monotonic())

                  last_state = state
                  time.sleep(0.002)

              elapsed = time.monotonic() - start

              if len(edge_times) >= 2:
                  periods = [
                      edge_times[i] - edge_times[i - 1]
                      for i in range(1, len(edge_times))
                  ]
                  avg_period = sum(periods) / len(periods)
                  freq = 1.0 / avg_period
              else:
                  freq = rising_edges / elapsed

              return freq, rising_edges, edge_times

          def assert_frequency(name, measured, expected, tolerance):
              low = expected - tolerance
              high = expected + tolerance

              print(f"{name}: measured {measured:.2f} Hz, expected around {expected:.2f} Hz")

              if not (low <= measured <= high):
                  print(f"FAIL: {name} frequency outside range {low:.2f} Hz - {high:.2f} Hz")
                  sys.exit(1)

              print(f"PASS: {name} frequency OK")

          try:
              print("Testing SLOW mode: button not pressed")
              stm_button.off()

              # Wait for firmware loop to settle
              time.sleep(2.5)

              slow_freq, slow_edges, _ = measure_frequency(duration_s=6.0)
              print(f"SLOW rising edges: {slow_edges}")

              # Your slow blink is 1s ON + 1s OFF = 0.5 Hz
              assert_frequency("SLOW mode", slow_freq, expected=0.5, tolerance=0.25)

              print("")
              print("Testing FAST mode: button pressed")
              stm_button.on()

              # Wait for firmware loop to notice button
              time.sleep(2.5)

              fast_freq, fast_edges, _ = measure_frequency(duration_s=4.0)
              print(f"FAST rising edges: {fast_edges}")

              # Your fast blink is 0.25s ON + 0.25s OFF = 2 Hz
              assert_frequency("FAST mode", fast_freq, expected=2.0, tolerance=0.5)

              print("")
              print("Checking that frequency changed")
              if fast_freq <= slow_freq * 2.0:
                  print(f"FAIL: fast frequency {fast_freq:.2f} Hz is not clearly faster than slow {slow_freq:.2f} Hz")
                  sys.exit(1)

              print("PASS: LED frequency changes when Raspberry Pi drives button GPIO")

          finally:
              stm_button.off()
              stm_button.close()
              stm_led.close()
          PYEOF