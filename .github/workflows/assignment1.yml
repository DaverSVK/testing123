name: Assignment 1 - GPIO PA3/PA4 Tests

on:
  push:
    branches: [ zadanie_cv1, zadanie_cv2, main, master ]
  pull_request:
    branches: [ zadanie_cv1, zadanie_cv2, main, master ]

env:
  BUILD_DIR: build
  ELF_NAME: vrs_cv2_ll_programming.elf

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Static analysis
  # ─────────────────────────────────────────────────────────────────────────────
  static-tests:
    name: "Static Analysis Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout tests (private)
        uses: actions/checkout@v4
        with:
          repository: DaverSVK/vrs-tests
          token: ${{ secrets.TESTS_REPO_TOKEN }}
          path: _tests-private

      - name: Place tests
        run: mv _tests-private/cv2 tests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Run static analysis tests
        run: |
          python3 -m pytest tests/test_assignment.py -v \
            --tb=short \
            --no-header \
            -p no:cacheprovider \
            2>&1 | tee static-test-results.txt
          exit ${PIPESTATUS[0]}

      - name: Upload static test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-test-results
          path: static-test-results.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Binary analysis
  # ─────────────────────────────────────────────────────────────────────────────
  binary-tests:
    name: "Binary Analysis Tests"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout tests (private)
        uses: actions/checkout@v4
        with:
          repository: DaverSVK/vrs-tests
          token: ${{ secrets.TESTS_REPO_TOKEN }}
          path: _tests-private

      - name: Place tests
        run: mv _tests-private/cv2 tests

      - name: Install ARM binutils and pytest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binutils-arm-none-eabi
          pip install pytest

      - name: Download ELF artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-elf
          path: ${{ env.BUILD_DIR }}

      - name: Disassemble ELF
        run: |
          arm-none-eabi-objdump -d "$BUILD_DIR/$ELF_NAME" > disassembly.txt
          arm-none-eabi-nm --numeric-sort "$BUILD_DIR/$ELF_NAME" > symbols.txt

      - name: Run binary analysis tests
        run: |
          python3 -m pytest tests/test_binary.py -v \
            --tb=short \
            --no-header \
            -p no:cacheprovider \
            2>&1 | tee binary-test-results.txt
            exit ${PIPESTATUS[0]}

      - name: Upload binary test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binary-test-results
          path: |
            binary-test-results.txt
            disassembly.txt
            symbols.txt
            build/vrs_cv2_ll_programming.elf
          retention-days: 30

  build:
    name: Build STM32 firmware
    runs-on: ubuntu-latest
    needs: static-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Build firmware
        run: |
          make -f Makefile.ci clean || true
          make -f Makefile.ci all

      - name: Check ELF exists
        run: |
          test -f "$BUILD_DIR/$ELF_NAME"
          arm-none-eabi-size "$BUILD_DIR/$ELF_NAME"
          file "$BUILD_DIR/$ELF_NAME"

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: firmware-elf
          path: ${{ env.BUILD_DIR }}/${{ env.ELF_NAME }}

  hardware-gpio-test:
    name: Raspberry Pi hardware GPIO test
    runs-on: [self-hosted, Linux, ARM64]
    needs: build
    if: github.event_name == 'push'

    env:
      STM32_TARGET_CFG: target/stm32f3x.cfg
      BUTTON_GPIO: "17"
      LED_GPIO: "27"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ELF
        uses: actions/download-artifact@v4
        with:
          name: firmware-elf
          path: ${{ env.BUILD_DIR }}

      - name: Flash STM32
        id: flash
        continue-on-error: true
        run: |
          set +e

          openocd -f interface/stlink.cfg -f "$STM32_TARGET_CFG" \
            -c "init" \
            -c "reset halt" \
            -c "program $BUILD_DIR/$ELF_NAME verify reset exit"

          FLASH_STATUS=$?

          if [ "$FLASH_STATUS" -eq 0 ]; then
            echo "flash_status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "flash_status=FAIL" >> "$GITHUB_OUTPUT"
            echo "FAIL" > hardware-result.txt
          fi

          exit 0

      - name: Test LED behavior from PA3 input
        id: hardware_test
        if: steps.flash.outputs.flash_status == 'PASS'
        continue-on-error: true
        run: |
          set +e

          python3 - <<'PYEOF'
          import os
          import time
          import sys
          from gpiozero import LED, DigitalInputDevice

          button_gpio = int(os.environ["BUTTON_GPIO"])
          led_gpio = int(os.environ["LED_GPIO"])

          button = LED(button_gpio)
          led = DigitalInputDevice(led_gpio, pull_up=False)

          def count_edges(seconds):
              start = time.monotonic()
              last = led.value
              rising = 0

              while time.monotonic() - start < seconds:
                  now = led.value
                  if last == 0 and now == 1:
                      rising += 1
                  last = now
                  time.sleep(0.002)

              return rising

          try:
              print("Testing PA3 LOW / button not pressed")
              button.off()
              time.sleep(2.0)
              slow_edges = count_edges(6.0)
              print("Slow mode rising edges:", slow_edges)

              print("Testing PA3 HIGH / button pressed")
              button.on()
              time.sleep(2.0)
              fast_edges = count_edges(4.0)
              print("Fast mode rising edges:", fast_edges)

              if slow_edges < 1:
                  print("FAIL: LED on PA4 does not blink in slow mode")
                  sys.exit(1)

              if fast_edges <= slow_edges:
                  print("FAIL: LED blink did not become faster when PA3 was driven HIGH")
                  sys.exit(1)

              print("PASS: PA3 changes PA4 blinking behavior")
              sys.exit(0)

          finally:
              button.off()
              button.close()
              led.close()
          PYEOF

          TEST_STATUS=$?

          if [ "$TEST_STATUS" -eq 0 ]; then
            echo "PASS" > hardware-result.txt
          else
            echo "FAIL" > hardware-result.txt
          fi

          exit 0

      - name: Ensure hardware result exists
        if: always()
        run: |
          if [ ! -f hardware-result.txt ]; then
            echo "FAIL" > hardware-result.txt
          fi

          echo "Hardware result:"
          cat hardware-result.txt

      - name: Upload hardware result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-result
          path: hardware-result.txt
          retention-days: 30

  grading:
      name: Final grading statistics
      runs-on: ubuntu-latest
      needs:
        - binary-tests
        - hardware-gpio-test
      if: always()

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Checkout tests (private)
          uses: actions/checkout@v4
          with:
            repository: DaverSVK/vrs-tests
            token: ${{ secrets.TESTS_REPO_TOKEN }}
            ref: main
            sparse-checkout: cv1
            sparse-checkout-cone-mode: true
            path: _tests-private

        - name: Place tests
          run: mv _tests-private/cv1 tests

        - name: Install pytest
          run: pip install pytest

        - name: Download binary test results
          uses: actions/download-artifact@v4
          with:
            name: binary-test-results
            path: .

        - name: Download hardware result
          uses: actions/download-artifact@v4
          with:
            name: hardware-result
            path: .
          continue-on-error: true

        - name: Print grading statistics
          run: |
            python3 tests/grade_assignment.py 2>&1 | tee grading-statistics.txt
            cat grading-statistics.txt >> "$GITHUB_STEP_SUMMARY"

        - name: Upload grading statistics
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: grading-statistics
            path: grading-statistics.txt
            retention-days: 30