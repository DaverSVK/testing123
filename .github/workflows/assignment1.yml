name: Assignment 4 - USART + DMA

on:
  push:
    branches: [ zadanie_cv1, zadanie_cv2, zadanie_cv3, zadanie_cv4, main, master ]
  pull_request:
    branches: [ zadanie_cv1, zadanie_cv2, zadanie_cv3, zadanie_cv4, main, master ]

env:
  BUILD_DIR: build
  ELF_NAME: usart_DMA.elf

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Static analysis
  # ─────────────────────────────────────────────────────────────────────────────
  static-tests:
    name: "Static Analysis Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout tests (private)
        uses: actions/checkout@v4
        with:
          repository: DaverSVK/vrs-tests
          token: ${{ secrets.TESTS_REPO_TOKEN }}
          path: _tests-private

      - name: Place tests
        run: mv _tests-private/cv4 tests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Run static analysis tests
        run: |
          python3 -m pytest tests/test_assignment.py -v \
            --tb=short \
            --no-header \
            -p no:cacheprovider \
            2>&1 | tee static-test-results.txt
          exit ${PIPESTATUS[0]}

      - name: Upload static test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-test-results
          path: static-test-results.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build STM32 firmware
    runs-on: ubuntu-latest
    # Deliberately NOT "needs: static-tests". A failing static check must not skip the
    # build, the binary analysis and the hardware test - every group is graded on its
    # own, so a partially finished assignment still has to reach the Raspberry Pi.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Build firmware
        run: |
          make -f Makefile.ci clean || true
          make -f Makefile.ci all

      - name: Check ELF exists
        run: |
          test -f "$BUILD_DIR/$ELF_NAME"
          arm-none-eabi-size "$BUILD_DIR/$ELF_NAME"
          file "$BUILD_DIR/$ELF_NAME"

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: firmware-elf
          path: ${{ env.BUILD_DIR }}/${{ env.ELF_NAME }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Binary analysis
  # ─────────────────────────────────────────────────────────────────────────────
  binary-tests:
    name: "Binary Analysis Tests"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout tests (private)
        uses: actions/checkout@v4
        with:
          repository: DaverSVK/vrs-tests
          token: ${{ secrets.TESTS_REPO_TOKEN }}
          path: _tests-private

      - name: Place tests
        run: mv _tests-private/cv4 tests

      - name: Install ARM binutils and pytest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binutils-arm-none-eabi
          pip install pytest

      - name: Download ELF artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-elf
          path: ${{ env.BUILD_DIR }}

      - name: Disassemble ELF
        run: |
          arm-none-eabi-objdump -d "$BUILD_DIR/$ELF_NAME" > disassembly.txt
          arm-none-eabi-nm --numeric-sort "$BUILD_DIR/$ELF_NAME" > symbols.txt
          arm-none-eabi-objdump -s -j .isr_vector "$BUILD_DIR/$ELF_NAME" > vectors.txt

      - name: Run binary analysis tests
        run: |
          python3 -m pytest tests/test_binary.py -v \
            --tb=short \
            --no-header \
            -p no:cacheprovider \
            2>&1 | tee binary-test-results.txt
          exit ${PIPESTATUS[0]}

      - name: Upload binary test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binary-test-results
          path: |
            binary-test-results.txt
            disassembly.txt
            symbols.txt
            vectors.txt
            build/usart_DMA.elf
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Hardware test on the Raspberry Pi (USART over the ST-LINK VCP)
  # ─────────────────────────────────────────────────────────────────────────────
  hardware-usart-test:
    name: Raspberry Pi hardware USART test
    runs-on: [self-hosted, Linux, ARM64]
    needs: build
    if: github.event_name == 'push'

    env:
      STM32_TARGET_CFG: target/stm32f3x.cfg
      # Leave empty to auto-discover the ST-LINK virtual COM port (/dev/ttyACM*).
      SERIAL_PORT: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout tests (private)
        uses: actions/checkout@v4
        with:
          repository: DaverSVK/vrs-tests
          token: ${{ secrets.TESTS_REPO_TOKEN }}
          path: _tests-private

      - name: Place tests
        run: mv _tests-private/cv4 tests

      - name: Download ELF
        uses: actions/download-artifact@v4
        with:
          name: firmware-elf
          path: ${{ env.BUILD_DIR }}

      - name: Ensure pyserial is available
        run: |
          if python3 -c "import serial" 2>/dev/null; then
            echo "pyserial is already installed"
          else
            python3 -m pip install --user --quiet pyserial \
              || python3 -m pip install --user --quiet --break-system-packages pyserial \
              || sudo apt-get install -y python3-serial
          fi

      - name: Flash STM32
        id: flash
        continue-on-error: true
        run: |
          set +e

          openocd -f interface/stlink.cfg -f "$STM32_TARGET_CFG" \
            -c "init" \
            -c "reset halt" \
            -c "program $BUILD_DIR/$ELF_NAME verify reset exit"

          FLASH_STATUS=$?

          if [ "$FLASH_STATUS" -eq 0 ]; then
            echo "flash_status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "flash_status=FAIL" >> "$GITHUB_OUTPUT"
            echo "FAIL" > hardware-result.txt
          fi

          exit 0

      - name: Test USART2 + DMA over the virtual COM port
        id: hardware_test
        if: steps.flash.outputs.flash_status == 'PASS'
        continue-on-error: true
        run: |
          set +e

          # openocd has just released the ST-LINK - give the CDC interface a moment
          # to re-enumerate and the firmware a moment to boot.
          sleep 3
          ls -l /dev/ttyACM* /dev/serial/by-id/* 2>/dev/null || true

          python3 tests/hw_usart_test.py
          TEST_STATUS=$?

          if [ "$TEST_STATUS" -eq 0 ]; then
            echo "PASS" > hardware-result.txt
          else
            echo "FAIL" > hardware-result.txt
          fi

          exit 0

      - name: Ensure hardware result exists
        if: always()
        run: |
          if [ ! -f hardware-result.txt ]; then
            echo "FAIL" > hardware-result.txt
          fi

          echo "Hardware result:"
          cat hardware-result.txt

      - name: Upload hardware result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-result
          path: |
            hardware-result.txt
            hardware-results.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Grading
  # ─────────────────────────────────────────────────────────────────────────────
  grading:
      name: Final grading statistics
      runs-on: ubuntu-latest
      needs:
        - binary-tests
        - hardware-usart-test
      if: always()

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Checkout tests (private)
          uses: actions/checkout@v4
          with:
            repository: DaverSVK/vrs-tests
            token: ${{ secrets.TESTS_REPO_TOKEN }}
            ref: main
            sparse-checkout: cv4
            sparse-checkout-cone-mode: true
            path: _tests-private

        - name: Place tests
          run: mv _tests-private/cv4 tests

        - name: Install pytest
          run: pip install pytest

        - name: Download binary test results
          uses: actions/download-artifact@v4
          with:
            name: binary-test-results
            path: .

        - name: Download hardware result
          uses: actions/download-artifact@v4
          with:
            name: hardware-result
            path: .
          continue-on-error: true

        - name: Print grading statistics
          run: |
            python3 tests/grade_assignment.py 2>&1 | tee grading-statistics.txt
            cat grading-statistics.txt >> "$GITHUB_STEP_SUMMARY"

        - name: Upload grading statistics
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: grading-statistics
            path: grading-statistics.txt
            retention-days: 30
